<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2e7d52">
    <title>智能数据展示（最终版）</title>
    <style>
        /* ===== 配色变量：农业绿 + 醒目红的价格 ===== */
        :root {
            --brand: #2e7d52;
            --brand-dark: #1f5c3b;
            --price: #e53935;
            --text: #1f2d3d;
            --muted: #7a8b99;
            --line: #e9efec;
            --bg: #f1f6f3;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            padding: 14px;                                   /* 手机上留出安全边距 */
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
            font-size: 17px;                                 /* 基准字号加大，方便中老年农户阅读 */
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
        }
        .container {
            max-width: 620px;
            margin: 0 auto;
            padding: 18px 16px 22px;
            background: #fff;
            border-radius: 18px;                             /* 更圆润的卡片 */
            box-shadow: 0 1px 2px rgba(16, 42, 30, .06), 0 10px 26px rgba(16, 42, 30, .09);
        }
        h1 { margin: 4px 0 8px; font-size: clamp(21px, 5.6vw, 26px); text-align: center; color: var(--brand-dark); letter-spacing: .5px; }
        .sub-title { font-size: 15px; text-align: center; color: var(--muted); padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
        /* 数据来源角标：用于标注「演示数据」或数据抓取时间 */
        .badge { display: none; margin: 10px auto 0; width: fit-content; padding: 3px 10px; border-radius: 999px; font-size: 12px; background: #eef2f5; color: #5d6d7e; border: 1px solid #d6dbdf; }
        .badge.badge-demo { background: #fff3cd; color: #8a6d3b; border-color: #ffe08a; font-weight: bold; }
        /* 数据统计截止时间（体现数据时效性） */
        .stat-time { display: none; margin: 8px 0 0; font-size: 13px; text-align: center; color: var(--muted); }
        /* 数据状态提示：历史累积进度 / 模拟补齐标注（诚实披露，必须显示） */
        .note { display: none; margin: 10px auto 0; width: fit-content; padding: 4px 12px; border-radius: 8px; font-size: 12px; line-height: 1.6; text-align: center; background: #f4f6f7; color: #7a8b99; }
        .note.note-warn { background: #fff8e1; color: #8a6d3b; border: 1px solid #ffe08a; }
        /* 条目上的「本次未更新」标记 */
        .stale { padding: 1px 6px; font-size: 11px; color: #b26a00; background: #fff3e0; border: 1px solid #ffcc80; border-radius: 4px; }
        /* 行情卡片 */
        .section-card { margin-top: 16px; padding: 14px 14px 4px; background: #fbfdfc; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(16, 42, 30, .04); }
        .section-title { margin-bottom: 4px; padding-left: 10px; font-size: 17px; font-weight: 700; color: var(--brand-dark); border-left: 5px solid var(--brand); }
        .item { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 13px 2px; border-bottom: 1px dashed var(--line); }
        .item:last-child { border-bottom: none; }
        .name { font-size: 18px; font-weight: 600; }
        .level { padding: 1px 8px; font-size: 12px; color: var(--brand-dark); background: #e8f5ec; border: 1px solid #cfe9d8; border-radius: 999px; }
        .price { margin-left: auto; font-size: 23px; font-weight: 800; color: var(--price); letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
        .date { flex-basis: 100%; font-size: 13px; color: var(--muted); }
        /* 状态提示与按钮 */
        .status { margin: 18px 0; font-size: 15px; text-align: center; color: var(--muted); }
        .error { color: var(--price); font-weight: 600; }
        .retry-btn { display: none; width: 100%; min-height: 48px; margin: 16px auto 0; padding: 12px 20px; font-size: 17px; font-weight: 600; color: #fff; background: var(--brand); border: none; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .retry-btn:active { background: var(--brand-dark); }
        .retry-btn:disabled { background: #a9b7b0; }
        /* 页脚数据来源说明：低调的小字提示 */
        .data-source-note { margin: 20px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.6; color: #9aa7b1; text-align: center; }
        /* ===== 骨架屏：数据没回来之前先占位 ===== */
        .skeleton { display: block; }
        .sk-card { margin-top: 16px; padding: 14px; background: #fbfdfc; border: 1px solid var(--line); border-radius: 14px; }
        .sk-line { height: 18px; margin: 12px 0; border-radius: 8px; background: linear-gradient(90deg, #eef2ef 25%, #e1ebe5 37%, #eef2ef 63%); background-size: 400% 100%; animation: sk-shimmer 1.4s ease-in-out infinite; }
        .sk-title { width: 44%; height: 20px; }
        .sk-row { width: 100%; }
        .sk-row.short { width: 72%; }
        @keyframes sk-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
        @media (prefers-reduced-motion: reduce) { .sk-line { animation: none; } }

        /* ===== 气象预警卡片 =====
           和绿色行情卡片明显区分：同色系浅底 + 左侧 8px 粗色条 + 同色等级胶囊，
           颜色按预警等级走（红 > 橙 > 黄 > 蓝），让人一眼看到风险。 */
        .alert-card { margin-top: 16px; padding: 14px 14px 12px 16px; border: 1px solid #ffcc80; border-left: 8px solid #ff8c00; border-radius: 14px; background: #ffe8cc; box-shadow: 0 1px 2px rgba(120, 60, 0, .08); }
        .alert-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
        .alert-icon { font-size: 22px; line-height: 1; }
        .alert-title { font-size: 18px; font-weight: 800; color: #7a3d00; }
        .alert-level { padding: 2px 10px; font-size: 13px; font-weight: 700; color: #fff; background: #ff8c00; border-radius: 999px; }
        /* 「模拟数据」标记：联调时一眼能看出不是真实预警 */
        .alert-mock { padding: 1px 8px; font-size: 12px; font-weight: 700; color: #8a6d3b; background: #fff3cd; border: 1px solid #ffe08a; border-radius: 999px; }
        .alert-body { margin-top: 8px; font-size: 15.5px; line-height: 1.7; color: #4a3520; }
        .alert-advice { margin-top: 10px; padding: 10px 12px; font-size: 15.5px; line-height: 1.65; color: #274b36; background: rgba(255, 255, 255, .78); border-radius: 10px; }
        .alert-advice .k { font-weight: 800; color: var(--brand-dark); }
        .alert-meta { margin-top: 10px; padding-top: 8px; border-top: 1px dashed rgba(0, 0, 0, .14); font-size: 12.5px; line-height: 1.6; color: #7a6248; }
        .alert-item + .alert-item { margin-top: 12px; padding-top: 12px; border-top: 1px dashed rgba(0, 0, 0, .14); }
        /* 等级配色：红色 */
        .alert-card.lv-red { background: #ffe0e0; border-color: #ffb3b3; border-left-color: #e60012; }
        .alert-card.lv-red .alert-level { background: #e60012; }
        .alert-card.lv-red .alert-title { color: #8c1010; }
        /* 等级配色：黄色 */
        .alert-card.lv-yellow { background: #fff8d6; border-color: #ffe58a; border-left-color: #e6b800; }
        .alert-card.lv-yellow .alert-level { background: #e6b800; }
        .alert-card.lv-yellow .alert-title { color: #6b5300; }
        /* 等级配色：蓝色（白色等级也归到这一档） */
        .alert-card.lv-blue { background: #e3f2fd; border-color: #a6d4f5; border-left-color: #1e90ff; }
        .alert-card.lv-blue .alert-level { background: #1e90ff; }
        .alert-card.lv-blue .alert-title { color: #10456e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>抓取数据展示</h1>
        <div id="location-info" class="sub-title">正在定位...</div>
        <div id="source-badge" class="badge"></div>
        <div id="stat-time" class="stat-time"></div>
        <div id="accumulate-note" class="note"></div>
        <div id="synthetic-note" class="note note-warn"></div>
        <div id="loading" class="status">正在获取数据...</div>

        <!-- 骨架屏：页面首屏就有内容感，不会空荡荡地干等 -->
        <div id="skeleton" class="skeleton" aria-hidden="true">
            <div class="sk-card">
                <div class="sk-line sk-title"></div>
                <div class="sk-line sk-row"></div>
                <div class="sk-line sk-row"></div>
                <div class="sk-line sk-row short"></div>
            </div>
        </div>

        <div id="sections-container"></div>
        <div id="error-msg" class="status error"></div>
        <button id="retry-btn" class="retry-btn" onclick="loadData()">重新尝试</button>

        <!-- 数据来源说明：这段文案现在由 JS 跟着 meta.source 自动填，
             不再需要人工维护（下面是拿不到元信息时的兜底文案）。 -->
        <p id="source-note" class="data-source-note">数据来源以实际抓取结果为准。前端架构已就绪，可随时接入官方 API 或真实数据源。</p>
    </div>

    <script>
        const loadingEl = document.getElementById('loading');
        const sectionsContainer = document.getElementById('sections-container');
        const errorEl = document.getElementById('error-msg');
        const retryBtn = document.getElementById('retry-btn');
        const locationInfo = document.getElementById('location-info');
        const badgeEl = document.getElementById('source-badge');
        const statTimeEl = document.getElementById('stat-time');
        const skeletonEl = document.getElementById('skeleton');

        const accumulateEl = document.getElementById('accumulate-note');
        const syntheticEl = document.getElementById('synthetic-note');
        const sourceNoteEl = document.getElementById('source-note');

        /* ==================== 一、数据格式适配 ====================
           这个页面要能同时吃三种格式（新前端产出的 / 早期版本的 / 最早的），
           统一成 { meta, items:[{name,grade,price,date,stale}] } 再渲染：
             ① v2 新格式：{ meta:{...}, crops:[{ name, grade, latest, date, stale, ... }] }
             ② v1 旧格式：{ location, source, fetched_at, stat_time, items:[{ name, level, price, date }] }
             ③ 最早格式：顶层直接是数组 */

        function adaptCrop(crop) {
            return {
                name: crop.name,
                grade: crop.grade,        // v2 里等级叫 grade
                price: crop.latest,       // v2 里价格叫 latest
                date: crop.date,
                stale: crop.stale === true,
                lastUpdated: crop.last_updated
            };
        }

        function adaptItem(item) {
            return {
                name: item.name,
                grade: item.level,        // 旧格式里等级叫 level
                price: item.price,
                date: item.date,
                stale: false
            };
        }

        function normalize(payload) {
            if (Array.isArray(payload)) {
                return { meta: {}, items: payload.map(adaptItem) };
            }
            if (!payload || typeof payload !== 'object') {
                return { meta: {}, items: [] };
            }
            // v2：元信息嵌在 payload.meta 里，数据在 payload.crops 里
            if (Array.isArray(payload.crops)) {
                return { meta: payload.meta || {}, items: payload.crops.map(adaptCrop) };
            }
            // v1：元信息就在顶层，数据在 payload.items 里
            if (Array.isArray(payload.items)) {
                return { meta: payload, items: payload.items.map(adaptItem) };
            }
            return { meta: {}, items: [] };
        }

        /* ==================== 二、顶部信息渲染 ==================== */

        // 数据来源角标：带元信息时才显示
        function renderBadge(meta) {
            const parts = [];
            if (meta.source) parts.push(meta.source);
            if (meta.fetched_at) parts.push('抓取时间：' + meta.fetched_at);

            if (parts.length === 0) {
                badgeEl.className = 'badge';
                badgeEl.textContent = '';
                badgeEl.style.display = 'none';
                return;
            }

            // 「演示 / 模拟 / 测试」这类数据用醒目样式提醒；真实抓取保持低调
            const isDemo = /演示|模拟|测试|mock|sample/i.test(meta.source || '');
            badgeEl.className = isDemo ? 'badge badge-demo' : 'badge';
            badgeEl.textContent = (isDemo ? '⚠ ' : '') + parts.join(' · ');
            badgeEl.style.display = 'block';
        }

        // 数据统计截止时间（用 textContent 赋值，天然不存在注入问题）
        function renderStatTime(meta) {
            if (!meta.stat_time) {
                statTimeEl.textContent = '';
                statTimeEl.style.display = 'none';
                return;
            }
            statTimeEl.textContent = '数据统计截止时间：' + meta.stat_time;
            statTimeEl.style.display = 'block';
        }

        // 累积进度 + 模拟补齐披露 —— 这两条是数据诚实性的底线，必须显示出来
        function renderNotes(meta) {
            if (meta.degraded && meta.series_days) {
                accumulateEl.textContent = '历史数据累积中：' + meta.series_days + ' / '
                    + (meta.series_target || 90) + ' 天';
                accumulateEl.style.display = 'block';
            } else {
                accumulateEl.textContent = '';
                accumulateEl.style.display = 'none';
            }

            if (meta.synthetic_history) {
                syntheticEl.textContent = '⚠️ 图表历史段含模拟补齐数据（每品种前 '
                    + (meta.synthetic_prefix_len || 0) + ' 个点），仅用于展示形态，不是真实抓取结果';
                syntheticEl.style.display = 'block';
            } else {
                syntheticEl.textContent = '';
                syntheticEl.style.display = 'none';
            }
        }

        // 页脚来源说明：跟着 meta.source 自动生成，不用再手工改文案
        const DEFAULT_SOURCE_NOTE = sourceNoteEl.textContent;
        function renderSourceNote(meta) {
            sourceNoteEl.textContent = meta.source
                ? '数据来源：' + meta.source + '。前端架构已就绪，可随时接入官方 API 或真实数据源。'
                : DEFAULT_SOURCE_NOTE;
        }

        // 安全过滤：凡是要拼进 innerHTML 的数据，必须先用它转义。
        // 防止将来接入真实数据时，字段里夹带 <script> / <img onerror=...> 之类的注入代码。
        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /* ==================== 三、气象预警渲染 ====================
           预警数据在 data.json 的【顶层 weather.active_alerts】里（由 fetch_weather_alerts.py 写入）：
             payload.weather = { location, lat, lon, provider, data_kind, fetched_at,
                                 alert_count, source, mirrored_to,
                                 active_alerts: [ { type, level, title, text, advice,
                                                    sender, pub_time, expire, src, data_kind } ] }
           兜底：万一没有 weather 块，就从 crops[].alerts.* 的字符串数组里取（去重后当正文）。
           容错：任何字段缺失只是少渲染一块；一条预警都没有就不渲染卡片，也不会报错。 */

        var ALERT_LEVELS = [
            { key: '红色', cls: 'lv-red',    icon: '🟥', order: 4 },
            { key: '橙色', cls: 'lv-orange', icon: '🟧', order: 3 },
            { key: '黄色', cls: 'lv-yellow', icon: '🟨', order: 2 },
            { key: '蓝色', cls: 'lv-blue',   icon: '🟦', order: 1 },
            { key: '白色', cls: 'lv-blue',   icon: '⬜', order: 0 }
        ];

        // 等级 → 配色/图标/优先级；认不出来的返回 null，由调用方兜底
        function levelInfo(level) {
            var text = String(level === null || level === undefined ? '' : level);
            for (var i = 0; i < ALERT_LEVELS.length; i++) {
                if (text.indexOf(ALERT_LEVELS[i].key) !== -1) return ALERT_LEVELS[i];
            }
            return null;
        }

        // 数据源地址：默认 /data.json；网址后加 ?data=data.mock.json 可临时指向别的文件（联调 mock 用）
        // 用 typeof 保护：jsc 测试环境里没有 location，这里绝不能抛错
        function resolveDataUrl() {
            try {
                if (typeof location !== 'undefined' && location && location.search) {
                    var m = /[?&]data=([^&]+)/.exec(location.search);
                    if (m && m[1]) return decodeURIComponent(m[1]);
                }
            } catch (e) { /* 拿不到就用默认值 */ }
            return '/data.json';
        }

        // 取预警：优先结构化 weather.active_alerts，其次 crops[].alerts 里的字符串
        function pickAlerts(payload) {
            if (!payload || typeof payload !== 'object' || Array.isArray(payload)) return null;

            var weather = payload.weather;
            if (weather && Array.isArray(weather.active_alerts) && weather.active_alerts.length > 0) {
                return {
                    alerts: weather.active_alerts,
                    kind: weather.data_kind,
                    source: weather.source,
                    fetchedAt: weather.fetched_at
                };
            }

            var meta = payload.meta || {};
            var crops = Array.isArray(payload.crops) ? payload.crops : [];
            var texts = [];
            crops.forEach(function (crop) {
                var block = crop && crop.alerts;
                if (!block) return;
                ['price', 'supply', 'risk'].forEach(function (key) {
                    if (!Array.isArray(block[key])) return;
                    block[key].forEach(function (t) {
                        var s = String(t === null || t === undefined ? '' : t).trim();
                        if (s && texts.indexOf(s) === -1) texts.push(s);
                    });
                });
            });
            if (texts.length === 0) return null;

            return {
                alerts: texts.map(function (t) { return { text: t }; }),
                kind: meta.weather_data_kind,
                source: meta.weather_source,
                fetchedAt: meta.weather_fetched_at
            };
        }

        // 解析一条预警的等级：优先用字段 level，其次从标题/正文里认（兜底字符串没有 level 字段）
        function resolveLevel(alert) {
            var a = alert || {};
            var info = levelInfo(a.level);
            if (info) return { level: info.key, info: info };
            var probe = levelInfo(String(a.title || '') + String(a.text || ''));
            if (probe) return { level: probe.key, info: probe };
            return { level: String(a.level === null || a.level === undefined ? '' : a.level).trim(), info: null };
        }

        // 单条预警 → HTML。所有来自数据的字段一律先 escapeHtml 再拼接（防 XSS）
        function alertItemHtml(alert) {
            var a = alert || {};
            var type = String(a.type || '').trim();
            var rl = resolveLevel(a);
            var level = rl.level;
            var info = rl.info;
            var title = (type || level)
                ? (type + level + '预警')
                : (String(a.title || '').trim() || '气象预警');

            var html = '<div class="alert-item">';
            html += '<div class="alert-head">';
            html += '<span class="alert-icon">' + escapeHtml(info ? info.icon : '⚠️') + '</span>';
            html += '<span class="alert-title">' + escapeHtml(title) + '</span>';
            if (level) html += '<span class="alert-level">' + escapeHtml(level) + '</span>';
            if (String(a.data_kind || '').toLowerCase() === 'mock') {
                html += '<span class="alert-mock">模拟数据</span>';
            }
            html += '</div>';

            // 正文：优先气象局原文（text），没有就用标题
            var body = String(a.text || '').trim() || String(a.title || '').trim();
            if (body) html += '<div class="alert-body">' + escapeHtml(body) + '</div>';

            // 建议：AI 生成的「该干啥」
            if (a.advice) {
                html += '<div class="alert-advice"><span class="k">该干啥：</span>'
                     + escapeHtml(a.advice) + '</div>';
            }

            // 来源：发布单位 + 时间（合规标注，必须显示）
            var bits = [];
            if (a.sender) bits.push('发布单位：' + escapeHtml(a.sender));
            if (a.pub_time) bits.push('发布时间：' + escapeHtml(a.pub_time));
            if (a.expire) bits.push('有效期至：' + escapeHtml(a.expire));
            if (a.src) bits.push('来源：' + escapeHtml(a.src));
            if (bits.length > 0) html += '<div class="alert-meta">' + bits.join(' ｜ ') + '</div>';

            html += '</div>';
            return html;
        }

        // 渲染整张预警卡片（排在行情卡片之后）。没有预警 → 返回 false，不渲染也不报错
        function renderAlertCard(payload) {
            var picked = pickAlerts(payload);
            if (!picked || picked.alerts.length === 0) return false;

            // 等级高的排前面；卡片整体用最高等级的配色
            var alerts = picked.alerts.slice().sort(function (x, y) {
                var ix = resolveLevel(x).info;
                var iy = resolveLevel(y).info;
                return (iy ? iy.order : -1) - (ix ? ix.order : -1);
            });
            var top = resolveLevel(alerts[0]).info;
            var cardCls = 'alert-card ' + (top ? top.cls : 'lv-orange');

            var inner = '';
            alerts.forEach(function (alert) { inner += alertItemHtml(alert); });

            var headTag = '';
            if (String(picked.kind || '').toLowerCase() === 'mock') headTag = '⚠️ 模拟数据，仅供联调';
            else if (picked.fetchedAt) headTag = '更新于 ' + picked.fetchedAt;

            var card = document.createElement('div');
            card.className = cardCls;
            card.innerHTML =
                '<div class="alert-head">' +
                    '<span class="alert-icon">🌦️</span>' +
                    '<span class="alert-title">气象预警（' + escapeHtml(alerts.length) + ' 条）</span>' +
                    (headTag ? '<span class="alert-mock">' + escapeHtml(headTag) + '</span>' : '') +
                '</div>' + inner;
            sectionsContainer.appendChild(card);
            return true;
        }

        async function loadData() {
            loadingEl.style.display = 'block';
            sectionsContainer.innerHTML = '';
            errorEl.textContent = '';
            retryBtn.style.display = 'none';
            retryBtn.disabled = true;
            locationInfo.textContent = '正在定位...';
            badgeEl.className = 'badge';
            badgeEl.textContent = '';
            badgeEl.style.display = 'none';
            statTimeEl.textContent = '';
            statTimeEl.style.display = 'none';
            accumulateEl.style.display = 'none';
            syntheticEl.style.display = 'none';
            skeletonEl.style.display = 'block';   // 先把骨架屏亮出来，避免页面空白

            try {
                // 默认请求静态托管根目录下的 data.json
                // ?t=Date.now() 强行绕过 CDN/浏览器缓存，保证看到最新抓取结果
                // 联调 mock 数据：在网址后加 ?data=data.mock.json 即可，不必覆盖线上文件
                const response = await fetch(resolveDataUrl() + '?t=' + Date.now());
                if (!response.ok) throw new Error('无法获取 data.json，请检查是否上传。');

                const payload = await response.json();
                loadingEl.style.display = 'none';
                skeletonEl.style.display = 'none';   // 数据到手，收起骨架屏

                const normalized = normalize(payload);
                const meta = normalized.meta;
                const items = normalized.items;

                locationInfo.textContent = `📍 ${meta.location || '全国'} | 🌾 粮油行情`;

                renderBadge(meta);
                renderStatTime(meta);
                renderNotes(meta);
                renderSourceNote(meta);

                if (items.length > 0) {
                    const card = document.createElement('div');
                    card.className = 'section-card';

                    let contentHtml = '';
                    // 【安全】所有来自 data.json 的字段一律先 escapeHtml 再拼接，杜绝 XSS
                    items.forEach(item => {
                        // 等级为「无」或空值时，不渲染绿色胶囊标签（否则会出现写着"无"的怪标签）
                        const gradeText = (item.grade === null || item.grade === undefined)
                            ? ''
                            : String(item.grade).trim();
                        const gradeHtml = (gradeText && gradeText !== '无')
                            ? `<span class="level">${escapeHtml(gradeText)}</span>`
                            : '';
                        // 本次没抓到的品种，价格是沿用的上一期，必须标出来
                        const staleHtml = item.stale
                            ? `<span class="stale">本次未更新${item.lastUpdated ? '（' + escapeHtml(item.lastUpdated) + '）' : ''}</span>`
                            : '';

                        contentHtml += `
                            <div class="item">
                                <span class="name">${escapeHtml(item.name)}</span>
                                ${gradeHtml}
                                ${staleHtml}
                                <span class="price">¥${escapeHtml(item.price)}</span>
                                <span class="date">${escapeHtml(item.date)}</span>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <div class="section-title">最新价格行情（粮油）</div>
                        <div>${contentHtml}</div>
                    `;
                    sectionsContainer.appendChild(card);
                } else {
                    errorEl.textContent = 'data.json 内容为空。';
                }

                // 气象预警卡片：有预警才渲染；没有预警字段 / 数组为空 → 静默跳过，不影响行情卡片
                renderAlertCard(payload);

            } catch (err) {
                loadingEl.style.display = 'none';
                skeletonEl.style.display = 'none';   // 出错时也要收起骨架屏，露出错误提示
                errorEl.textContent = '无法获取数据，请确保 data.json 已上传到静态托管。';
                retryBtn.style.display = 'block';
                retryBtn.disabled = false;
                console.error('请求失败:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
